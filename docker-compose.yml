version: '3.8'

services:
  voting-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spartans-voting-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - voting-network

networks:
  voting-network:
    driver: bridge